[package]
name = "markdown-it-rs-linkify"
version = "0.1.0"
description = "linkify-it compatible URL and email detection for markdown-it-rs"
documentation = "https://docs.rs/markdown-it-rs-linkify"
repository = "https://github.com/GSGFs7/markdown-it-rs"
keywords = ["linkify", "url", "markdown"]
license = "MIT"
edition = "2024"

[dependencies]
linkify-upstream = { package = "linkify", version = ">= 0.10.0, < 0.12" }
unicode-general-category = ">= 0.1.0, < 1.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "linkify_differential"
path = "examples/differential.rs"
