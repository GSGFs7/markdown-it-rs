# this action tests that minimal possible semver versions are correct,
# if it fails, there's probably minimal dependency version needs to be bumped
name: minimal-dep-check-ignore-this

on:
  - push
  - pull_request

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - nightly

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - name: Resolve minimum dependency versions
        run: cargo +nightly -Z minimal-versions update
      - name: Test minimum dependency versions on a single thread
        run: cargo +nightly test --locked --no-default-features --features linkify -- --test-threads=1
