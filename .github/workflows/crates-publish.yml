name: Publish Rust crate

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  publish:
    name: Publish markdown-it-rs to crates.io
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CRATE_VERSION="$(
            cargo metadata --no-deps --locked --format-version 1 |
              jq -r '.packages[] | select(.name == "markdown-it-rs") | .version'
          )"
          if [[ "$RELEASE_TAG" != "v$CRATE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match crate version v$CRATE_VERSION" >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish --locked -p markdown-it-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
