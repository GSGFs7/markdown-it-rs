name: tests

on:
  - push
  - pull_request

permissions: read-all

jobs:
  quality:
    name: Format
    runs-on: ubuntu-latest
    env:
      CARGO_NET_RETRY: "3"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all --check
      # standalone workspace
      - name: Check formatting of the plugin authoring crate
        run: cargo +nightly fmt --check --manifest-path examples/plugin-authoring/Cargo.toml

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_NET_RETRY: "3"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: no default features
            args: --no-default-features
          - name: source maps only
            args: --no-default-features --features sourcemap
          - name: linkify only
            args: --no-default-features --features linkify
          - name: CLI only
            args: --no-default-features --features cli
          - name: KaTeX only
            args: --no-default-features --features katex
          - name: syntect only
            args: --no-default-features --features syntect
          - name: linkify with source maps
            args: --no-default-features --features linkify,sourcemap
          - name: all features
            args: --all-features
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy -p markdown-it-rs --locked --all-targets ${{ matrix.args }} -- -D warnings

  subcrates:
    name: Test and Clippy (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_NET_RETRY: "3"
    strategy:
      fail-fast: false
      matrix:
        package:
          - markdown-it-rs-url
          - markdown-it-rs-linkify
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy -p ${{ matrix.package }} --locked --all-targets --all-features -- -D warnings
      - name: Run unit, integration, and documentation tests
        if: ${{ !cancelled() }}
        run: cargo test -p ${{ matrix.package }} --locked --all-features --no-fail-fast

  plugin-authoring:
    name: Plugin authoring (standalone crate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_NET_RETRY: "3"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --manifest-path examples/plugin-authoring/Cargo.toml --all-targets -- -D warnings
      - name: Test with default features
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path examples/plugin-authoring/Cargo.toml
      - name: Test without default features
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path examples/plugin-authoring/Cargo.toml --no-default-features
      - name: Test with source maps
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path examples/plugin-authoring/Cargo.toml --no-default-features --features sourcemap
      - name: Run plugin examples
        if: ${{ !cancelled() }}
        run: cargo run --manifest-path examples/plugin-authoring/Cargo.toml

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_NET_RETRY: "3"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: no default features
            args: --no-default-features
          - name: source maps only
            args: --no-default-features --features sourcemap
          - name: linkify without source maps
            args: --no-default-features --features linkify
          - name: all features
            args: --all-features
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit and integration tests
        shell: bash
        run: |
          test_targets=()
          for test_file in tests/*.rs; do
            test_name="$(basename "$test_file" .rs)"
            if [[ "$test_name" != pathological ]]; then
              test_targets+=(--test "$test_name")
            fi
          done
          cargo test -p markdown-it-rs --locked --no-fail-fast ${{ matrix.args }} --lib --bins --examples "${test_targets[@]}"
      - name: Run documentation tests
        if: ${{ !cancelled() }}
        run: cargo test -p markdown-it-rs --locked --no-fail-fast ${{ matrix.args }} --doc

  pathological:
    name: Pathological tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_NET_RETRY: "3"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: no default features
            args: --no-default-features
          - name: source maps only
            args: --no-default-features --features sourcemap
          - name: linkify without source maps
            args: --no-default-features --features linkify
          - name: all features
            args: --all-features
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run pathological tests on a single thread
        run: cargo test -p markdown-it-rs --locked --no-fail-fast ${{ matrix.args }} --test pathological -- --test-threads=1
