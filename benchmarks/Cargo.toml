[package]
name = "markdown-it-benchmarks"
version = "0.0.0"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
comrak = "0.52"
criterion = "0.8"
markdown = "1.0"
markdown-it-rs = { path = "../" }
markdown-it-v6 = { package = "markdown-it", version = "0.6" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
harness = false

[[bench]]
name = "smartquotes"
path = "benches/smartquotes.rs"
harness = false

[[bench]]
name = "typographer"
path = "benches/typographer.rs"
harness = false

[[bench]]
name = "heading_anchors"
path = "benches/heading_anchors.rs"
harness = false

[[bench]]
name = "document"
path = "benches/document.rs"
harness = false

[workspace]
