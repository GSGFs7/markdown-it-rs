name: Publish npm package

on:
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish WASM package to npm
    if: startsWith(github.event.release.tag_name, 'npm-v')
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.82.2
        with:
          tool: wasm-pack@0.15.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          NPM_VERSION="$(node -p "require('./bindings/wasm/package.json').version")"
          CARGO_VERSION="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "markdown-it-rs-wasm") | .version'
          )"

          if [[ "$RELEASE_TAG" != "npm-v$NPM_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match npm version npm-v$NPM_VERSION" >&2
            exit 1
          fi

          if [[ "$CARGO_VERSION" != "$NPM_VERSION" ]]; then
            echo "Cargo version $CARGO_VERSION does not match npm version $NPM_VERSION" >&2
            exit 1
          fi

      - name: Build basic and full WASM packages
        working-directory: bindings/wasm
        run: npm run build

      - name: Inspect package contents
        working-directory: bindings/wasm
        run: npm pack --dry-run --ignore-scripts

      - name: Publish package
        working-directory: bindings/wasm
        run: npm publish --access public --provenance --ignore-scripts
